# Still manual-only (workflow_dispatch): the repo isn't on GitHub yet, and the
# server copy at the path below isn't a clone, so `git pull` would fail. Once
# the repo is pushed and cloned onto the server, add:
#
#   push:
#     branches: [main]
#
# to the triggers so it deploys automatically like imposter does.
#
# The backend reads CORS_ORIGINS at runtime from ecosystem.config.js, so a
# domain change here only needs a pm2 restart — no rebuild.
name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/games/letterraid/backend
            git pull origin main
            npm ci
            npm run build
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
